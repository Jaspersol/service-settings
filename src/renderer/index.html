<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ServiceSettings</title>

    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
    <link href="./assets/toolbar.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div class="container" id="container">
      <div class="card-add">
        <div class="add" id="add">+</div>
      </div>
      <div class="modal" id="myModal">
        <div class="modal-content">
          <h3>新增服务</h3>
          <div class="form-group">
            <label for="nodeName">节点名称：</label>
            <input type="text" id="nodeName" placeholder="请输入节点名称" />
          </div>
          <div class="form-group">
            <label for="serviceName">服务名称：</label>
            <input type="text" id="serviceName" placeholder="请输入服务名称" />
          </div>
          <div class="btn-group">
            <button class="btn-cancel" id="cancelBtn">取消</button>
            <button class="btn-confirm" id="confirmBtn">确认</button>
          </div>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn-tool" id="exportBtn">导出配置</button>
      <button class="btn-tool" id="importBtn">导入配置</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
    <script type="module" src="./src/switch.js"></script>
  </body>
</html>
